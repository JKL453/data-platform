apiVersion: v1
kind: PersistentVolume
metadata:
  name: hoerspiel-data-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  hostPath:
    path: /data/hoerspiel-explorer
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hoerspiel-data-pvc
  namespace: prefect
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 10Gi
  volumeName: hoerspiel-data-pv